<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${pageTitle}">Paper</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="margin-bottom:1rem;">
            <a th:href="@{/papers}" class="btn btn-secondary btn-sm">&larr; Papers</a>
        </div>
        <h1 class="page-title" th:text="${pageTitle}">Paper</h1>
    </div>

    <div class="card" style="max-width:680px;">
        <div class="card-body">
            <form th:action="${formAction}" method="post">

                <div class="form-group">
                    <label class="form-label required" for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-control"
                           th:value="${paper?.title}" placeholder="Paper title" required autofocus/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="thesis">Thesis / Abstract</label>
                    <textarea id="thesis" name="thesis" class="form-control" rows="3"
                              placeholder="State your thesis or abstract…"
                              th:text="${paper?.thesis}"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="author">Author</label>
                    <input type="text" id="author" name="author" class="form-control"
                           th:value="${paper?.author}" placeholder="Your name"/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="status">Status</label>
                    <select id="status" name="status" class="form-control">
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.name().replace('_',' ')}"
                                th:selected="${paper?.status != null and paper.status == s}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="topicsSelect">Topics</label>
                    <select id="topicsSelect" name="topicIds" class="form-control" multiple size="5">
                        <option th:each="t : ${allTopics}"
                                th:value="${t.id}"
                                th:text="${t.title}"
                                th:selected="${paper != null and paper.topics.contains(t)}">
                        </option>
                    </select>
                    <div class="form-hint">Hold Ctrl/Cmd to select multiple topics.</div>
                </div>

                <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${paper?.id != null ? 'Save Paper' : 'Create Paper'}">Create Paper</span>
                    </button>
                    <a th:href="@{/papers}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
