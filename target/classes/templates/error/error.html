<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Error</title></head>
<body>
<div layout:fragment="content">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; padding: 80px 24px;">
        <div style="font-size: 80px; font-weight: 700; color: var(--text-secondary); line-height: 1; margin-bottom: 24px;"
             th:text="${status != null ? status : '500'}">500</div>
        <p style="font-size: 17px; color: var(--text-primary); margin: 0 0 40px; max-width: 480px;"
           th:text="${message != null ? message : 'Something went wrong. Please try again.'}">Something went wrong.</p>
        <a th:href="@{/dashboard}" class="btn btn-primary">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
