<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Dashboard</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <h1 class="page-title">Dashboard</h1>
            <div style="display:flex;gap:0.5rem;">
                <a th:href="@{/notes/new}" class="btn btn-primary">+ New Note</a>
                <a th:href="@{/papers/new}" class="btn btn-secondary">+ New Paper</a>
            </div>
        </div>
    </div>

    <!-- Active Courses -->
    <section th:if="${not #lists.isEmpty(activeCourses)}" style="margin-bottom:2rem;">
        <div class="section-header">
            <h2>Active Courses</h2>
            <a th:href="@{/courses}" class="btn btn-secondary btn-sm">All Courses</a>
        </div>
        <div class="card-grid">
            <div th:each="cp : ${activeCourses}" class="card">
                <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
                    <a th:href="@{/courses/{id}(id=${cp.course.id})}" th:text="${cp.course.title}" class="card-title-link"></a>
                </div>
                <div class="card-body">
                    <div style="background:var(--border);border-radius:4px;height:6px;margin:0.5rem 0;overflow:hidden;">
                        <div th:style="'background:var(--color-primary);height:100%;border-radius:4px;width:' + (${cp.total} > 0 ? ${cp.done} * 100 / ${cp.total} : 0) + '%'"></div>
                    </div>
                    <span class="text-secondary text-small"
                          th:text="${cp.done} + ' / ' + ${cp.total} + ' tasks done'"></span>
                </div>
            </div>
        </div>
    </section>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:1.5rem;">

        <!-- Recent Notes -->
        <section>
            <div class="section-header">
                <h2>Recent Notes</h2>
                <a th:href="@{/notes}" class="btn btn-secondary btn-sm">All Notes</a>
            </div>
            <div th:if="${#lists.isEmpty(recentNotes)}" class="empty-state">
                <p>No notes yet. <a th:href="@{/notes/new}">Create your first note.</a></p>
            </div>
            <ul class="item-list" th:unless="${#lists.isEmpty(recentNotes)}">
                <li th:each="note : ${recentNotes}" class="item-list-row"
                    style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0.5rem 0;border-bottom:1px solid var(--border);">
                    <div style="flex:1;min-width:0;">
                        <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.title}"
                           style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;"></a>
                    </div>
                    <span th:if="${note.starred}" style="color:var(--color-warning);">★</span>
                    <span class="text-secondary text-small"
                          th:text="${#temporals.format(note.updatedAt, 'MMM d')}"></span>
                </li>
            </ul>
        </section>

        <!-- Recent Papers -->
        <section>
            <div class="section-header">
                <h2>Recent Papers</h2>
                <a th:href="@{/papers}" class="btn btn-secondary btn-sm">All Papers</a>
            </div>
            <div th:if="${#lists.isEmpty(recentPapers)}" class="empty-state">
                <p>No papers yet. <a th:href="@{/papers/new}">Start a new paper.</a></p>
            </div>
            <ul class="item-list" th:unless="${#lists.isEmpty(recentPapers)}">
                <li th:each="paper : ${recentPapers}"
                    style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0.5rem 0;border-bottom:1px solid var(--border);">
                    <a th:href="@{/papers/{id}(id=${paper.id})}" th:text="${paper.title}"
                       style="font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></a>
                    <span class="badge" th:text="${paper.status}"
                          th:style="'background:' + (${paper.status.name()} == 'COMPLETE' ? 'var(--color-success)' : (${paper.status.name()} == 'IN_PROGRESS' ? 'var(--color-primary)' : 'var(--border)')) + ';color:' + (${paper.status.name()} == 'DRAFT' ? 'var(--text-secondary)' : 'white')"></span>
                </li>
            </ul>
        </section>

    </div>

</div>
</body>
</html>
