<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE - Theology Tracker">Theology Tracker</title>

    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

    <link rel="stylesheet" th:href="@{/static/css/main.css}"/>
    <th:block layout:fragment="head"></th:block>
</head>
<body>

    <header class="nav-header">
        <div class="nav-container">
            <a class="nav-brand" th:href="@{/dashboard}">&#10022; Theology Tracker</a>

            <nav class="nav-links">
                <a th:href="@{/dashboard}"    class="nav-link">Dashboard</a>
                <a th:href="@{/courses}"      class="nav-link">Courses</a>
                <a th:href="@{/topics}"       class="nav-link">Topics</a>
                <a th:href="@{/notes}"        class="nav-link">Notes</a>
                <a th:href="@{/sessions}"     class="nav-link">Sessions</a>
                <a th:href="@{/methods}"      class="nav-link">Methods</a>
                <a th:href="@{/calendar}"     class="nav-link">Calendar</a>
            </nav>

            <form class="nav-search" th:action="@{/search}" method="get">
                <input type="search" name="q" placeholder="Search..."
                       th:value="${param.q}"
                       class="nav-search-input"/>
                <button type="submit" class="nav-search-btn" aria-label="Search">&#8981;</button>
            </form>
        </div>
    </header>

    <div class="flash-container" th:if="${successMessage != null or errorMessage != null}">
        <div class="flash flash-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
        <div class="flash flash-error"   th:if="${errorMessage != null}"   th:text="${errorMessage}"></div>
    </div>

    <main class="main-content" id="main-content">
        <div layout:fragment="content"></div>
    </main>

    <footer class="app-footer">
        <span>Theology Study Tracker &#8212; local &amp; private</span>
    </footer>

    <script th:src="@{/static/js/main.js}" defer></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
