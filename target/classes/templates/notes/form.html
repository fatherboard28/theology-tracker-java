<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${pageTitle}">Note</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center gap-4" style="margin-bottom: 1rem;">
            <a th:href="${note != null ? '/notes/' + note.id : parent.url()}"
               class="btn btn-secondary btn-sm">&larr; Back</a>
        </div>
        <h1 class="page-title" th:text="${pageTitle}">Note</h1>
    </div>

    <form th:action="${formAction}" method="post">
        <input type="hidden" name="parentType" th:value="${parent.type().name()}"/>
        <input type="hidden" name="parentId" th:value="${parent.id()}"/>

        <!-- Title -->
        <div class="form-group">
            <label class="form-label required" for="title">Title</label>
            <input type="text" id="title" name="title" class="form-control"
                   th:value="${note != null ? note.title : ''}"
                   placeholder="Note title" required autofocus/>
        </div>

        <!-- Primary parent (display only) -->
        <div class="form-group">
            <label class="form-label">Primary Parent</label>
            <div class="text-small text-muted">
                <span th:text="${parent.type().name().replace('_', ' ')}">TYPE</span>
                &mdash;
                <a th:href="${parent.url()}" th:text="${parent.label()}">Parent</a>
            </div>
        </div>

        <!-- Body — split-pane editor -->
        <div class="form-group">
            <div class="d-flex align-center" style="justify-content: space-between; margin-bottom: 0.5rem;">
                <label class="form-label" style="margin: 0;">Body <span class="text-muted" style="font-weight: 400;">(Markdown)</span></label>
                <span id="autosave-status" class="text-muted text-small" style="font-style: italic;"
                      th:if="${note != null}"></span>
            </div>
            <div class="note-editor-layout">
                <div class="note-editor-pane">
                    <div class="form-label text-muted" style="font-size: 0.75rem; margin-bottom: 0.25rem;">Write</div>
                    <textarea id="note-body-editor" name="body"
                              class="form-control note-editor-textarea"
                              placeholder="Write your note in Markdown..."
                              th:text="${note != null ? note.body : ''}"
                              th:attr="hx-post=${note != null ? '/notes/' + note.id + '/autosave' : null},
                                       hx-trigger=${note != null ? 'keyup changed delay:800ms' : null},
                                       hx-include=${note != null ? 'this' : null},
                                       hx-target=${note != null ? '#autosave-status' : null},
                                       hx-swap=${note != null ? 'innerHTML' : null}"></textarea>
                </div>
                <div class="note-preview-pane">
                    <div class="form-label text-muted" style="font-size: 0.75rem; margin-bottom: 0.25rem;">Preview</div>
                    <div id="note-body-preview" class="markdown-preview note-editor-preview"></div>
                </div>
            </div>
        </div>

        <!-- Topic Tags -->
        <div th:replace="~{topics/tag-select-fragment :: topicMultiSelect(${allTopics}, ${note != null ? note.topicTags.![id] : null})}"></div>

        <div class="d-flex gap-4" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Save Note</button>
            <a th:href="${note != null ? '/notes/' + note.id : parent.url()}"
               class="btn btn-secondary">Cancel</a>
        </div>
    </form>

</div>
</body>
</html>
