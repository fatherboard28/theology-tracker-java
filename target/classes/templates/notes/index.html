<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Notes</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
                <h1 class="page-title"
                    th:text="${filterTopic != null ? filterTopic.title + ' — Notes' : 'All Notes'}">Notes</h1>
                <p class="page-subtitle" th:if="${filterTopic == null}">All freestanding notes tagged to topics.</p>
            </div>
            <a th:href="@{/notes/new(topicId=${filterTopic?.id})}" class="btn btn-primary">+ New Note</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(notes)}">
        <p>No notes yet. <a th:href="@{/notes/new}">Create your first note.</a></p>
    </div>

    <div th:unless="${#lists.isEmpty(notes)}">
        <div th:each="note : ${notes}"
             style="display:flex;align-items:flex-start;gap:1rem;padding:0.75rem 0;border-bottom:1px solid var(--border);">
            <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.2rem;">
                    <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.title}"
                       style="font-weight:600;font-size:1rem;"></a>
                    <span th:if="${note.starred}" style="color:var(--color-warning);">★</span>
                </div>
                <div class="text-muted text-small"
                     th:unless="${note.body == null or note.body.isBlank()}"
                     th:text="${#strings.abbreviate(note.body, 140)}"></div>
                <div th:unless="${#sets.isEmpty(note.topics)}"
                     style="display:flex;flex-wrap:wrap;gap:0.35rem;margin-top:0.4rem;">
                    <a th:each="t : ${note.topics}"
                       th:href="@{/topics/{id}(id=${t.id})}"
                       th:text="${t.title}"
                       class="topic-tag topic-tag-sm" style="text-decoration:none;"></a>
                </div>
            </div>
            <span class="text-secondary text-small" style="flex-shrink:0;padding-top:0.2rem;"
                  th:text="${#temporals.format(note.updatedAt, 'MMM d, yyyy')}"></span>
        </div>
    </div>

</div>
</body>
</html>
