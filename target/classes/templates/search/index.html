<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Search</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Search</h1>
        <p class="page-subtitle" th:if="${result != null}">
            <strong th:text="${result.query()}"></strong>
            &mdash;
            <span class="text-muted" th:text="${result.totalCount()} + (${result.totalCount()} == 1 ? ' result' : ' results')"></span>
        </p>
        <p class="page-subtitle" th:if="${result == null}">Search across topics, notes, and papers.</p>
    </div>

    <div class="card" style="max-width:640px;margin-bottom:2rem;">
        <div class="card-body">
            <form th:action="@{/search}" method="get" style="display:flex;gap:0.75rem;">
                <input type="search" name="q" class="form-control" th:value="${query}"
                       placeholder="Search topics, notes, papers…" autocomplete="off" autofocus style="flex:1;"/>
                <button type="submit" class="btn btn-primary" style="flex-shrink:0;">Search</button>
            </form>
        </div>
    </div>

    <div th:if="${result == null}" class="empty-state">
        <p>Enter a query above to search all content.</p>
    </div>

    <div th:if="${result != null and !result.hasResults()}" class="empty-state">
        <p>No results found for <strong th:text="${query}"></strong>.</p>
    </div>

    <div th:if="${result != null and result.hasResults()}">

        <!-- Topics -->
        <section th:unless="${#lists.isEmpty(result.topics())}" style="margin-bottom:2rem;">
            <h3 style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);margin-bottom:0.75rem;">
                Topics <span class="badge" style="margin-left:0.4rem;" th:text="${#lists.size(result.topics())}"></span>
            </h3>
            <div th:each="t : ${result.topics()}"
                 style="padding:0.6rem 0;border-bottom:1px solid var(--border);">
                <a th:href="@{/topics/{id}(id=${t.id})}" th:text="${t.title}" style="font-weight:500;"></a>
                <div class="text-muted text-small" th:if="${t.description != null}"
                     th:text="${#strings.abbreviate(t.description, 100)}"></div>
            </div>
        </section>

        <!-- Notes -->
        <section th:unless="${#lists.isEmpty(result.notes())}" style="margin-bottom:2rem;">
            <h3 style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);margin-bottom:0.75rem;">
                Notes <span class="badge" style="margin-left:0.4rem;" th:text="${#lists.size(result.notes())}"></span>
            </h3>
            <div th:each="n : ${result.notes()}"
                 style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:0.6rem 0;border-bottom:1px solid var(--border);">
                <div style="flex:1;min-width:0;">
                    <a th:href="@{/notes/{id}(id=${n.id})}" th:text="${n.title}" style="font-weight:500;"></a>
                    <div class="text-muted text-small" th:unless="${n.body == null or n.body.isBlank()}"
                         th:text="${#strings.abbreviate(n.body, 100)}"></div>
                </div>
                <span class="text-muted text-small" style="flex-shrink:0;"
                      th:text="${#temporals.format(n.updatedAt, 'MMM d, yyyy')}"></span>
            </div>
        </section>

        <!-- Papers -->
        <section th:unless="${#lists.isEmpty(result.papers())}">
            <h3 style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);margin-bottom:0.75rem;">
                Papers <span class="badge" style="margin-left:0.4rem;" th:text="${#lists.size(result.papers())}"></span>
            </h3>
            <div th:each="p : ${result.papers()}"
                 style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:0.6rem 0;border-bottom:1px solid var(--border);">
                <div style="flex:1;min-width:0;">
                    <a th:href="@{/papers/{id}(id=${p.id})}" th:text="${p.title}" style="font-weight:500;"></a>
                    <div class="text-muted text-small" th:if="${p.thesis != null}"
                         th:text="${#strings.abbreviate(p.thesis, 100)}"></div>
                </div>
                <span class="badge" th:text="${p.status}"></span>
            </div>
        </section>

    </div>

</div>
</body>
</html>
