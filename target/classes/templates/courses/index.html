<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Courses</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
                <h1 class="page-title">Courses</h1>
                <p class="page-subtitle">Learning paths with a kanban task board.</p>
            </div>
            <a th:href="@{/courses/new}" class="btn btn-primary">+ New Course</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(courses)}">
        <p>No courses yet. <a th:href="@{/courses/new}">Create your first course.</a></p>
    </div>

    <div th:unless="${#lists.isEmpty(courses)}">
        <div th:each="course : ${courses}"
             style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.75rem 0;border-bottom:1px solid var(--border);">
            <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.2rem;">
                    <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}"
                       style="font-weight:600;font-size:1rem;"></a>
                    <span class="badge"
                          th:text="${course.status}"
                          th:style="'background:' + (${course.status.name()} == 'ACTIVE' ? 'var(--color-primary)' : (${course.status.name()} == 'COMPLETE' ? 'var(--color-success)' : 'var(--border)')) + ';color:' + (${course.status.name()} == 'PAUSED' ? 'var(--text-secondary)' : 'white')"></span>
                </div>
                <div class="text-muted text-small" th:if="${course.description}"
                     th:text="${#strings.abbreviate(course.description, 100)}"></div>
            </div>
            <div style="display:flex;gap:0.5rem;flex-shrink:0;">
                <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-secondary btn-sm">Open</a>
                <form th:action="@{/courses/{id}/delete(id=${course.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            th:attr="data-confirm='Delete &quot;' + ${course.title} + '&quot;?'">Delete</button>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
