<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${course.title}">Course</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="margin-bottom:1rem;">
            <a th:href="@{/courses}" class="btn btn-secondary btn-sm">&larr; Courses</a>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
            <div>
                <h1 class="page-title" style="margin:0;" th:text="${course.title}">Course</h1>
                <p class="page-subtitle" th:if="${course.description}" th:text="${course.description}"></p>
            </div>
            <div style="display:flex;gap:0.5rem;flex-shrink:0;">
                <a th:href="@{/courses/{id}/edit(id=${course.id})}" class="btn btn-secondary btn-sm">Edit</a>
            </div>
        </div>
    </div>

    <!-- Add task form -->
    <details style="margin-bottom:1.25rem;">
        <summary style="cursor:pointer;font-weight:600;font-size:0.9rem;color:var(--text-secondary);list-style:none;display:flex;align-items:center;gap:0.4rem;">
            <span>&#43;</span> Add Task
        </summary>
        <div class="card" style="margin-top:0.75rem;max-width:580px;">
            <div class="card-body">
                <form th:action="@{/courses/{id}/tasks(id=${course.id})}" method="post">
                    <div class="form-group">
                        <label class="form-label required" for="taskTitle">Title</label>
                        <input type="text" id="taskTitle" name="title" class="form-control"
                               placeholder="Task title" required autofocus/>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="taskDesc">Description</label>
                        <textarea id="taskDesc" name="description" class="form-control" rows="2"
                                  placeholder="Optional description"></textarea>
                    </div>
                    <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                        <div class="form-group" style="flex:1;min-width:140px;">
                            <label class="form-label" for="taskStatus">Status</label>
                            <select id="taskStatus" name="status" class="form-control">
                                <option value="TO_DO">To Do</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="DONE">Done</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex:1;min-width:140px;">
                            <label class="form-label" for="taskDue">Due Date</label>
                            <input type="date" id="taskDue" name="dueDate" class="form-control"/>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Add Task</button>
                </form>
            </div>
        </div>
    </details>

    <!-- Kanban board -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start;">

        <!-- TO DO -->
        <div>
            <div style="font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-secondary);margin-bottom:0.75rem;padding:0.4rem 0;border-bottom:2px solid var(--border);">
                To Do <span class="text-muted" th:text="'(' + ${#lists.size(toDo)} + ')'"></span>
            </div>
            <div class="kanban-col" id="col-TO_DO" data-status="TO_DO"
                 th:data-course-id="${course.id}"
                 style="display:flex;flex-direction:column;gap:0.5rem;min-height:120px;">
                <div th:each="task : ${toDo}" th:replace="~{courses/show :: taskCard(${task}, ${course.id}, ${allNotes}, ${allPapers})}"></div>
            </div>
        </div>

        <!-- IN PROGRESS -->
        <div>
            <div style="font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-primary);margin-bottom:0.75rem;padding:0.4rem 0;border-bottom:2px solid var(--color-primary);">
                In Progress <span class="text-muted" th:text="'(' + ${#lists.size(inProgress)} + ')'"></span>
            </div>
            <div class="kanban-col" id="col-IN_PROGRESS" data-status="IN_PROGRESS"
                 th:data-course-id="${course.id}"
                 style="display:flex;flex-direction:column;gap:0.5rem;min-height:120px;">
                <div th:each="task : ${inProgress}" th:replace="~{courses/show :: taskCard(${task}, ${course.id}, ${allNotes}, ${allPapers})}"></div>
            </div>
        </div>

        <!-- DONE -->
        <div>
            <div style="font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-success);margin-bottom:0.75rem;padding:0.4rem 0;border-bottom:2px solid var(--color-success);">
                Done <span class="text-muted" th:text="'(' + ${#lists.size(done)} + ')'"></span>
            </div>
            <div class="kanban-col" id="col-DONE" data-status="DONE"
                 th:data-course-id="${course.id}"
                 style="display:flex;flex-direction:column;gap:0.5rem;min-height:120px;">
                <div th:each="task : ${done}" th:replace="~{courses/show :: taskCard(${task}, ${course.id}, ${allNotes}, ${allPapers})}"></div>
            </div>
        </div>

    </div>

</div>

<!-- ── Task card fragment ─────────────────────────────────────────────────── -->
<div th:fragment="taskCard(task, courseId, allNotes, allPapers)"
     class="kanban-card"
     th:data-task-id="${task.id}"
     style="background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:0.75rem;cursor:grab;">

    <div style="font-weight:600;font-size:0.9rem;margin-bottom:0.3rem;" th:text="${task.title}">Task</div>
    <div class="text-muted text-small" th:if="${task.description}" th:text="${task.description}" style="margin-bottom:0.4rem;"></div>
    <div class="text-muted text-small" th:if="${task.dueDate}"
         th:text="'Due: ' + ${#temporals.format(task.dueDate, 'MMM d')}" style="margin-bottom:0.4rem;"></div>

    <!-- Attached notes -->
    <div th:unless="${#sets.isEmpty(task.noteRefs)}" style="margin-bottom:0.4rem;">
        <div th:each="n : ${task.noteRefs}"
             style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;font-size:0.8rem;padding:0.2rem 0;">
            <a th:href="@{/notes/{id}(id=${n.id})}" th:text="${n.title}" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></a>
            <form th:action="@{/courses/{cid}/tasks/{tid}/notes/{nid}/detach(cid=${courseId},tid=${task.id},nid=${n.id})}" method="post" style="display:inline;">
                <button type="submit" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:0.75rem;" title="Remove">×</button>
            </form>
        </div>
    </div>

    <!-- Attached papers -->
    <div th:unless="${#sets.isEmpty(task.paperRefs)}" style="margin-bottom:0.4rem;">
        <div th:each="p : ${task.paperRefs}"
             style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;font-size:0.8rem;padding:0.2rem 0;">
            <a th:href="@{/papers/{id}(id=${p.id})}" th:text="${p.title}" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></a>
            <form th:action="@{/courses/{cid}/tasks/{tid}/papers/{pid}/detach(cid=${courseId},tid=${task.id},pid=${p.id})}" method="post" style="display:inline;">
                <button type="submit" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:0.75rem;" title="Remove">×</button>
            </form>
        </div>
    </div>

    <!-- Card actions -->
    <div style="display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--border);">
        <!-- Move to status buttons -->
        <form th:if="${task.status.name() != 'TO_DO'}"
              th:action="@{/courses/{cid}/tasks/{tid}/status(cid=${courseId},tid=${task.id})}" method="post" style="display:inline;">
            <input type="hidden" name="status" value="TO_DO"/>
            <button type="submit" class="btn btn-secondary btn-sm" style="font-size:0.7rem;padding:0.15rem 0.4rem;">← To Do</button>
        </form>
        <form th:if="${task.status.name() != 'IN_PROGRESS'}"
              th:action="@{/courses/{cid}/tasks/{tid}/status(cid=${courseId},tid=${task.id})}" method="post" style="display:inline;">
            <input type="hidden" name="status" value="IN_PROGRESS"/>
            <button type="submit" class="btn btn-secondary btn-sm" style="font-size:0.7rem;padding:0.15rem 0.4rem;">In Progress</button>
        </form>
        <form th:if="${task.status.name() != 'DONE'}"
              th:action="@{/courses/{cid}/tasks/{tid}/status(cid=${courseId},tid=${task.id})}" method="post" style="display:inline;">
            <input type="hidden" name="status" value="DONE"/>
            <button type="submit" class="btn btn-secondary btn-sm" style="font-size:0.7rem;padding:0.15rem 0.4rem;">Done ✓</button>
        </form>

        <!-- Attach note -->
        <div x-data="{ open: false }" style="position:relative;display:inline-block;" th:unless="${#lists.isEmpty(allNotes)}">
            <button @click="open=!open" type="button" class="btn btn-secondary btn-sm" style="font-size:0.7rem;padding:0.15rem 0.4rem;">+ Note</button>
            <div x-show="open" x-cloak style="display:none;position:absolute;left:0;top:100%;z-index:30;background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:0.5rem;min-width:220px;">
                <form th:action="@{/courses/{cid}/tasks/{tid}/notes/attach(cid=${courseId},tid=${task.id})}" method="post">
                    <select name="noteId" class="form-control" style="font-size:0.8rem;margin-bottom:0.35rem;">
                        <option th:each="n : ${allNotes}" th:value="${n.id}" th:text="${n.title}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm" style="width:100%;font-size:0.8rem;">Attach</button>
                </form>
            </div>
        </div>

        <!-- Attach paper -->
        <div x-data="{ open: false }" style="position:relative;display:inline-block;" th:unless="${#lists.isEmpty(allPapers)}">
            <button @click="open=!open" type="button" class="btn btn-secondary btn-sm" style="font-size:0.7rem;padding:0.15rem 0.4rem;">+ Paper</button>
            <div x-show="open" x-cloak style="display:none;position:absolute;left:0;top:100%;z-index:30;background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:0.5rem;min-width:220px;">
                <form th:action="@{/courses/{cid}/tasks/{tid}/papers/attach(cid=${courseId},tid=${task.id})}" method="post">
                    <select name="paperId" class="form-control" style="font-size:0.8rem;margin-bottom:0.35rem;">
                        <option th:each="p : ${allPapers}" th:value="${p.id}" th:text="${p.title}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm" style="width:100%;font-size:0.8rem;">Attach</button>
                </form>
            </div>
        </div>

        <!-- Delete -->
        <form th:action="@{/courses/{cid}/tasks/{tid}/delete(cid=${courseId},tid=${task.id})}" method="post" style="display:inline;margin-left:auto;">
            <button type="submit" class="btn btn-danger btn-sm" style="font-size:0.7rem;padding:0.15rem 0.4rem;"
                    th:attr="data-confirm='Delete task &quot;' + ${task.title} + '&quot;?'">×</button>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
/* SortableJS drag-and-drop between kanban columns */
document.addEventListener('DOMContentLoaded', function () {
    if (typeof Sortable === 'undefined') return;

    document.querySelectorAll('.kanban-col').forEach(function (col) {
        Sortable.create(col, {
            group:     'kanban',
            animation: 150,
            handle:    '.kanban-card',
            onEnd: function (evt) {
                var card     = evt.item;
                var taskId   = card.dataset.taskId;
                var newCol   = evt.to;
                var newStatus = newCol.dataset.status;
                var courseId = newCol.dataset.courseId;

                /* Update status if column changed */
                if (evt.from !== evt.to) {
                    fetch('/courses/' + courseId + '/tasks/' + taskId + '/status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'status=' + encodeURIComponent(newStatus)
                    });
                }

                /* Persist new order within column */
                var ids = Array.from(newCol.querySelectorAll('.kanban-card')).map(function (c) { return c.dataset.taskId; });
                var params = new URLSearchParams();
                ids.forEach(function (id) { params.append('ids[]', id); });
                fetch('/courses/' + courseId + '/tasks/reorder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
            }
        });
    });
});
</script>
</th:block>
</body>
</html>
