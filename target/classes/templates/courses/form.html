<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${pageTitle}">Course</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="margin-bottom:1rem;">
            <a th:href="@{/courses}" class="btn btn-secondary btn-sm">&larr; Courses</a>
        </div>
        <h1 class="page-title" th:text="${pageTitle}">Course</h1>
    </div>

    <div class="card" style="max-width:640px;">
        <div class="card-body">
            <form th:action="${formAction}" method="post">

                <div class="form-group">
                    <label class="form-label required" for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-control"
                           th:value="${course?.title}" placeholder="Course title" required autofocus/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="3"
                              placeholder="What is this course about?"
                              th:text="${course?.description}"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="status">Status</label>
                    <select id="status" name="status" class="form-control">
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.name()}"
                                th:selected="${course?.status != null and course.status == s}">
                        </option>
                    </select>
                </div>

                <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary"
                            th:text="${course?.id != null ? 'Save Course' : 'Create Course'}">Create Course</button>
                    <a th:href="@{/courses}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
