<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE - Theology Tracker">Theology Tracker</title>

    <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>

    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

    <link rel="stylesheet" th:href="@{/static/css/main.css}"/>
    <th:block layout:fragment="head"></th:block>
</head>
<body>

<div class="app-layout">

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="sidebar-brand" th:href="@{/dashboard}">
                <div class="sidebar-brand-icon">T</div>
                <span class="sidebar-brand-name">Theology</span>
            </a>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">
                <i data-lucide="x" width="16" height="16"></i>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/dashboard}" class="sidebar-link"
               th:classappend="${requestURI?.startsWith('/dashboard') or requestURI == '/'} ? 'active'">
                <i data-lucide="layout-dashboard" width="20" height="20"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/topics}" class="sidebar-link"
               th:classappend="${requestURI?.startsWith('/topics')} ? 'active'">
                <i data-lucide="tag" width="20" height="20"></i>
                <span>Topics</span>
            </a>
            <a th:href="@{/notes}" class="sidebar-link"
               th:classappend="${requestURI?.startsWith('/notes')} ? 'active'">
                <i data-lucide="file-text" width="20" height="20"></i>
                <span>Notes</span>
            </a>
            <a th:href="@{/papers}" class="sidebar-link"
               th:classappend="${requestURI?.startsWith('/papers')} ? 'active'">
                <i data-lucide="scroll-text" width="20" height="20"></i>
                <span>Papers</span>
            </a>
            <a th:href="@{/courses}" class="sidebar-link"
               th:classappend="${requestURI?.startsWith('/courses')} ? 'active'">
                <i data-lucide="graduation-cap" width="20" height="20"></i>
                <span>Courses</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a th:href="@{/settings}" class="sidebar-link" style="font-size: var(--text-xs);">
                <i data-lucide="settings" width="16" height="16"></i>
                Settings
            </a>
            <span style="font-size: var(--text-xs); color: var(--text-secondary); margin-top: 4px; display: block;">local &amp; private</span>
        </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ── Main Area ───────────────────────────────────────────────────────── -->
    <div class="main-wrapper">

        <header class="topbar">
            <button class="topbar-menu-btn" id="sidebar-open" aria-label="Open menu">
                <i data-lucide="menu" width="20" height="20"></i>
            </button>
            <form class="topbar-search" th:action="@{/search}" method="get">
                <i class="topbar-search-icon" data-lucide="search" width="15" height="15"></i>
                <input type="search" name="q" placeholder="Search notes, papers, topics..."
                       th:value="${param.q}"
                       class="topbar-search-input"/>
            </form>
            <button class="topbar-theme-btn" id="theme-toggle" aria-label="Toggle dark mode">
                <i class="icon-moon" data-lucide="moon" width="20" height="20"></i>
                <i class="icon-sun" data-lucide="sun" width="20" height="20"></i>
            </button>
        </header>

        <div class="flash-container" th:if="${successMessage != null or errorMessage != null}">
            <div class="flash flash-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
            <div class="flash flash-error"   th:if="${errorMessage != null}"   th:text="${errorMessage}"></div>
        </div>

        <main class="main-content" id="main-content">
            <div layout:fragment="content"></div>
        </main>

        <footer class="app-footer">
            Theology Study Tracker &mdash; local &amp; private
        </footer>

    </div>
</div>

<script th:src="@{/static/js/main.js}" defer></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
