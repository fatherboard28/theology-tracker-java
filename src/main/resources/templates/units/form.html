<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${pageTitle}">Unit</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center gap-4" style="margin-bottom: 1rem;">
            <a th:href="@{/courses/{id}(id=${courseId})}" class="btn btn-secondary btn-sm">&larr; Back to Course</a>
        </div>
        <h1 class="page-title" th:text="${pageTitle}">Unit</h1>
    </div>

    <div class="card" style="max-width: 680px;">
        <div class="card-body">
            <form th:action="${formAction}" method="post">

                <div class="form-group">
                    <label class="form-label required" for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-control"
                           th:value="${unit.title}" placeholder="e.g. How to Read a Book" required autofocus/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="3"
                              placeholder="Optional description of this unit's scope..."
                              th:text="${unit.description}"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="targetCompletion">Target Completion</label>
                    <input type="date" id="targetCompletion" name="targetCompletion" class="form-control"
                           th:value="${unit.targetCompletion}"/>
                </div>

                <div class="d-flex gap-4" style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" th:text="${pageTitle}">Save</button>
                    <a th:href="@{/courses/{id}(id=${courseId})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
