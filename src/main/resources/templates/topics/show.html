<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${topic.title}">Topic</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="margin-bottom:1rem;">
            <a th:href="@{/topics}" class="btn btn-secondary btn-sm">&larr; Topics</a>
            <span th:if="${topic.parentTopic != null}" class="text-muted text-small" style="margin-left:0.5rem;">
                under <a th:href="@{/topics/{id}(id=${topic.parentTopic.id})}" th:text="${topic.parentTopic.title}">Parent</a>
            </span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
            <div>
                <h1 class="page-title" style="margin:0;" th:text="${topic.title}">Topic</h1>
                <p class="page-subtitle" th:if="${topic.description}" th:text="${topic.description}"></p>
                <!-- Subtopics -->
                <div th:unless="${#lists.isEmpty(topic.subtopics)}"
                     style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;">
                    <span class="text-muted text-small">Subtopics:</span>
                    <a th:each="sub : ${topic.subtopics}"
                       th:href="@{/topics/{id}(id=${sub.id})}"
                       th:text="${sub.title}"
                       class="topic-tag topic-tag-sm" style="text-decoration:none;"></a>
                    <a th:href="@{/topics/new(parentTopicId=${topic.id})}" class="text-muted text-small">+ add</a>
                </div>
                <div th:if="${#lists.isEmpty(topic.subtopics)}" style="margin-top:0.35rem;">
                    <a th:href="@{/topics/new(parentTopicId=${topic.id})}" class="text-muted text-small">+ add subtopic</a>
                </div>
            </div>
            <div style="display:flex;gap:0.5rem;flex-shrink:0;">
                <a th:href="@{/topics/{id}/edit(id=${topic.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/topics/{id}/delete(id=${topic.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            th:attr="data-confirm='Delete &quot;' + ${topic.title} + '&quot;? Subtopics will become root topics.'">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notes tagged to this topic -->
    <section style="margin-bottom:2rem;">
        <div class="section-header">
            <h2>Notes <span class="text-muted text-small" th:text="'(' + ${#lists.size(notes)} + ')'"></span></h2>
            <a th:href="@{/notes/new(topicId=${topic.id})}" class="btn btn-primary btn-sm">+ New Note</a>
        </div>
        <div th:if="${#lists.isEmpty(notes)}" class="empty-state">
            <p>No notes tagged to this topic. <a th:href="@{/notes/new(topicId=${topic.id})}">Create one.</a></p>
        </div>
        <div th:unless="${#lists.isEmpty(notes)}">
            <div th:each="note : ${notes}"
                 style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.6rem 0;border-bottom:1px solid var(--border);">
                <div style="flex:1;min-width:0;">
                    <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.title}"
                       style="font-weight:500;"></a>
                    <span th:if="${note.starred}" style="color:var(--color-warning);margin-left:0.25rem;">★</span>
                    <div class="text-muted text-small" th:unless="${note.body == null or note.body.isBlank()}"
                         th:text="${#strings.abbreviate(note.body, 100)}"></div>
                </div>
                <span class="text-secondary text-small"
                      th:text="${#temporals.format(note.updatedAt, 'MMM d')}"></span>
            </div>
        </div>
    </section>

    <!-- Papers tagged to this topic -->
    <section>
        <div class="section-header">
            <h2>Papers <span class="text-muted text-small" th:text="'(' + ${#lists.size(papers)} + ')'"></span></h2>
            <a th:href="@{/papers/new}" class="btn btn-primary btn-sm">+ New Paper</a>
        </div>
        <div th:if="${#lists.isEmpty(papers)}" class="empty-state">
            <p>No papers tagged to this topic yet.</p>
        </div>
        <div th:unless="${#lists.isEmpty(papers)}">
            <div th:each="paper : ${papers}"
                 style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.6rem 0;border-bottom:1px solid var(--border);">
                <div style="flex:1;min-width:0;">
                    <a th:href="@{/papers/{id}(id=${paper.id})}" th:text="${paper.title}"
                       style="font-weight:500;"></a>
                    <div class="text-muted text-small" th:if="${paper.thesis != null}" th:text="${#strings.abbreviate(paper.thesis, 100)}"></div>
                </div>
                <span class="badge" th:text="${paper.status}"></span>
            </div>
        </div>
    </section>

</div>
</body>
</html>
