<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Study Sessions</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem;">
            <div>
                <h1 class="page-title">Study Sessions</h1>
                <p class="page-subtitle" th:if="${!#lists.isEmpty(sessions)}"
                   th:text="${#lists.size(sessions) + ' session' + (#lists.size(sessions) != 1 ? 's' : '') + ' logged'}"></p>
            </div>
            <a th:href="@{/sessions/new}" class="btn btn-primary">+ Log Session</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(sessions)}" style="padding: 3rem 0;">
        <p>No sessions logged yet. <a th:href="@{/sessions/new}">Log your first session.</a></p>
    </div>

    <div th:if="${!#lists.isEmpty(sessions)}">
        <div th:each="s : ${sessions}"
             class="card"
             style="margin-bottom: 0.75rem;">
            <div class="card-body" style="padding: 1rem 1.25rem;">
                <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 0;">
                        <div class="d-flex align-center gap-4" style="margin-bottom: 0.3rem; flex-wrap: wrap;">
                            <span style="font-weight: 600;"
                                  th:text="${#temporals.format(s.sessionDate, 'MMM d, yyyy')}">Date</span>
                            <span class="badge"
                                  th:text="${s.durationMinutes} + ' min'">0 min</span>
                            <span class="text-small text-muted" th:if="${s.method != null}">
                                via <a th:href="@{/methods/{id}(id=${s.method.id})}"
                                       th:text="${s.method.name}">Method</a>
                            </span>
                        </div>
                        <div class="text-small" th:if="${s.workItem != null}" style="margin-bottom: 0.25rem;">
                            <span class="text-muted">Work item:</span>
                            <a th:href="@{/work-items/{id}(id=${s.workItem.id})}"
                               th:text="${s.workItem.title}">Work Item</a>
                        </div>
                        <div class="text-small text-muted" th:if="${s.workItem == null}"
                             style="margin-bottom: 0.25rem; font-style: italic;">Free-form session</div>
                        <div class="text-small text-muted"
                             th:if="${s.reflectionNote != null and !s.reflectionNote.isBlank()}"
                             th:text="${#strings.abbreviate(s.reflectionNote, 100)}"></div>
                        <div th:if="${!#sets.isEmpty(s.topics)}"
                             class="topic-tags-row" style="margin-top: 0.4rem;">
                            <span th:each="topic : ${s.topics}" class="topic-tag topic-tag-sm">
                                <a th:href="@{/topics/{id}(id=${topic.id})}" th:text="${topic.title}">Topic</a>
                            </span>
                        </div>
                    </div>
                    <a th:href="@{/sessions/{id}(id=${s.id})}"
                       class="btn btn-secondary btn-sm" style="flex-shrink: 0;">View</a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
