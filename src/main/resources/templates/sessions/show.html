<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${#temporals.format(session.sessionDate, 'MMM d, yyyy')} + ' — Session'">Session</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center gap-4" style="margin-bottom: 1rem;">
            <a th:href="@{/sessions}" class="btn btn-secondary btn-sm">&larr; Sessions</a>
        </div>
        <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem;">
            <div style="flex: 1; min-width: 0;">
                <div class="d-flex align-center gap-4" style="margin-bottom: 0.5rem; flex-wrap: wrap;">
                    <h1 class="page-title" style="margin: 0;"
                        th:text="${#temporals.format(session.sessionDate, 'EEEE, MMMM d, yyyy')}">Date</h1>
                    <span class="badge" th:text="${session.durationMinutes} + ' min'">0 min</span>
                </div>
                <p class="page-subtitle text-muted text-small" th:if="${session.workItem != null}">
                    <a th:href="@{/work-items/{id}(id=${session.workItem.id})}"
                       th:text="${session.workItem.title}">Work Item</a>
                </p>
                <p class="page-subtitle text-muted text-small" th:if="${session.workItem == null}"
                   style="font-style: italic;">Free-form session</p>
            </div>
            <div class="d-flex gap-2" style="flex-shrink: 0;">
                <a th:href="@{/sessions/{id}/edit(id=${session.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/sessions/{id}/delete(id=${session.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            data-confirm="Delete this session?">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Meta card -->
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-body">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; align-items: start;">
                <div>
                    <div class="form-label" style="margin-bottom: 0.5rem;">Duration</div>
                    <div style="font-weight: 600;" th:text="${session.durationMinutes} + ' minutes'">0 minutes</div>
                </div>
                <div>
                    <div class="form-label" style="margin-bottom: 0.5rem;">Method</div>
                    <div th:if="${session.method != null}">
                        <a th:href="@{/methods/{id}(id=${session.method.id})}"
                           th:text="${session.method.name}">Method</a>
                    </div>
                    <div th:if="${session.method == null}" class="text-muted text-small">None</div>
                </div>
                <div>
                    <div class="form-label" style="margin-bottom: 0.5rem;">Topic Tags</div>
                    <div th:if="${!#sets.isEmpty(session.topics)}" class="topic-tags-row">
                        <span th:each="topic : ${session.topics}" class="topic-tag topic-tag-sm">
                            <a th:href="@{/topics/{id}(id=${topic.id})}" th:text="${topic.title}">Topic</a>
                        </span>
                    </div>
                    <div th:if="${#sets.isEmpty(session.topics)}" class="text-muted text-small">None</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Work item link -->
    <div class="card" style="margin-bottom: 1.5rem;" th:if="${session.workItem != null}">
        <div class="card-body">
            <div class="form-label" style="margin-bottom: 0.5rem;">Work Item</div>
            <a th:href="@{/work-items/{id}(id=${session.workItem.id})}"
               th:text="${session.workItem.title}" style="font-weight: 500;"></a>
        </div>
    </div>

    <!-- Reflection -->
    <div class="card" style="margin-bottom: 1.5rem;"
         th:if="${session.reflectionNote != null and !session.reflectionNote.isBlank()}">
        <div class="card-body">
            <h2 style="font-size: 1rem; font-weight: 600; margin: 0 0 0.75rem;">Reflection</h2>
            <div class="text-small" style="white-space: pre-wrap;" th:text="${session.reflectionNote}"></div>
        </div>
    </div>

    <!-- Scripture Tags -->
    <div class="card" style="margin-bottom: 1.5rem;" th:if="${!scriptureTags.isEmpty()}">
        <div class="card-body">
            <h2 style="font-size: 1rem; font-weight: 600; margin: 0 0 0.75rem;">Scripture Tags</h2>
            <div class="topic-tags-row">
                <span th:each="tag : ${scriptureTags}" class="topic-tag">
                    <span th:text="${tag.reference}"></span>
                </span>
            </div>
        </div>
    </div>

    <!-- Log another session -->
    <div style="margin-top: 2rem;">
        <a th:href="@{/sessions/new}" class="btn btn-secondary btn-sm">+ Log Another Session</a>
    </div>

</div>
</body>
</html>
