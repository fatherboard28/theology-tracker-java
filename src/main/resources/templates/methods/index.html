<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Methods</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem;">
            <div>
                <h1 class="page-title">Methods</h1>
                <p class="page-subtitle">Personal study methods and practices.</p>
            </div>
            <a th:href="@{/methods/new}" class="btn btn-primary">+ New Method</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(methods)}">
        <p>No methods yet. <a th:href="@{/methods/new}">Create your first method</a> to track study practices.</p>
    </div>

    <div class="topic-list" th:if="${!#lists.isEmpty(methods)}">
        <div class="topic-card" th:each="method : ${methods}">
            <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem;">
                <div style="flex: 1; min-width: 0;">
                    <div class="d-flex align-center gap-4" style="margin-bottom: 0.25rem; flex-wrap: wrap;">
                        <a class="topic-card-title"
                           th:href="@{/methods/{id}(id=${method.id})}"
                           th:text="${method.name}">Method Name</a>
                        <span class="text-small text-muted"
                              th:text="${usageCounts[method.id]} + ' session' + (${usageCounts[method.id]} != 1 ? 's' : '')">0 sessions</span>
                    </div>
                    <p class="text-small text-muted" style="margin: 0;"
                       th:if="${method.description}" th:text="${method.description}"></p>
                </div>
                <div class="d-flex gap-2" style="flex-shrink: 0;">
                    <a th:href="@{/methods/{id}/edit(id=${method.id})}" class="btn btn-secondary btn-sm">Edit</a>
                    <form th:action="@{/methods/{id}/delete(id=${method.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:attr="data-confirm='Delete method &quot;' + ${method.name} + '&quot;? Session references will be cleared.'">
                            Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
