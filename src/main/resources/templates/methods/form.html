<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${pageTitle}">Method</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center gap-4" style="margin-bottom: 1rem;">
            <a th:href="@{/methods}" class="btn btn-secondary btn-sm">&larr; Methods</a>
        </div>
        <h1 class="page-title" th:text="${pageTitle}">Method</h1>
    </div>

    <div class="card" style="max-width: 680px;">
        <div class="card-body">
            <form th:action="${formAction}" method="post">

                <div class="form-group">
                    <label class="form-label required" for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control"
                           th:value="${method.name}"
                           placeholder="e.g. Inductive Bible Study, SOAP Method, Lectio Divina"
                           required autofocus/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="3"
                              placeholder="Brief description of this method..."
                              th:text="${method.description}"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="personalNotes">Personal Notes</label>
                    <textarea id="personalNotes" name="personalNotes" class="form-control" rows="6"
                              placeholder="Personal notes on how you apply this method, tips, reminders..."
                              th:text="${method.personalNotes}"></textarea>
                    <div class="form-hint">Notes on applying this method in your own practice.</div>
                </div>

                <div class="d-flex gap-4" style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" th:text="${pageTitle}">Save</button>
                    <a th:href="@{/methods}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
