<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${pageTitle}">Note</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div style="margin-bottom:1rem;">
            <a th:href="@{/notes}" class="btn btn-secondary btn-sm">&larr; Notes</a>
        </div>
        <h1 class="page-title" th:text="${pageTitle}">Note</h1>
    </div>

    <div class="card" style="max-width:680px;">
        <div class="card-body">
            <form th:action="${formAction}" method="post">

                <div class="form-group">
                    <label class="form-label required" for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-control"
                           th:value="${note?.title}" placeholder="Note title" required autofocus/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="topicsSelect">Topics</label>
                    <select id="topicsSelect" name="topicIds" class="form-control" multiple size="5">
                        <option th:each="t : ${allTopics}"
                                th:value="${t.id}"
                                th:text="${t.title}"
                                th:selected="${note != null and note.topics.contains(t) or (preselectedTopicId != null and t.id == preselectedTopicId)}">
                        </option>
                    </select>
                    <div class="form-hint">Hold Ctrl/Cmd to select multiple topics.</div>
                </div>

                <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${note?.id != null ? 'Save Note' : 'Create Note'}">Create Note</span>
                    </button>
                    <a th:href="@{/notes}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
