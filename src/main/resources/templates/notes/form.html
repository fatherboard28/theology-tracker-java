<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>New Note</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-center gap-4" style="margin-bottom: 1rem;">
            <a th:href="${parent.url()}" class="btn btn-secondary btn-sm">&larr; Back</a>
        </div>
        <h1 class="page-title">New Note</h1>
        <p class="page-subtitle">
            <span th:text="${parent.type().name().replace('_',' ')}">TYPE</span>
            &mdash;
            <a th:href="${parent.url()}" th:text="${parent.label()}">Parent</a>
        </p>
    </div>

    <div class="card" style="max-width: 560px;">
        <div class="card-body">
            <form th:action="${formAction}" method="post">
                <input type="hidden" name="parentType" th:value="${parent.type().name()}"/>
                <input type="hidden" name="parentId"   th:value="${parent.id()}"/>

                <div class="form-group">
                    <label class="form-label required" for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-control"
                           placeholder="Note title" required autofocus/>
                </div>

                <div class="d-flex gap-4" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">Create Note</button>
                    <a th:href="${parent.url()}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
