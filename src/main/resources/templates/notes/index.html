<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${filterParent != null ? filterParent.label() + ' — Notes' : 'All Notes'}">Notes</title>
</head>
<body>
<div layout:fragment="content" style="backgound-color: white">

    <div class="page-header">
        <div class="d-flex align-center gap-4" style="margin-bottom: 1rem;" th:if="${filterParent != null}">
            <a th:href="${filterParent.url()}" class="btn btn-secondary btn-sm">&larr; Back</a>
        </div>
        <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem;">
            <div>
                <h1 class="page-title"
                    th:text="${filterParent != null ? filterParent.label() + ' — Notes' : 'All Notes'}">Notes</h1>
                <p class="page-subtitle" th:if="${filterParent == null}">All notes across courses, topics, and methods.</p>
            </div>
            <a th:if="${filterParent != null}"
               th:href="@{/notes/new(parentType=${filterParent.type().name()},parentId=${filterParent.id()})}"
               class="btn btn-primary">+ New Note</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(notes)}">
        <p th:if="${filterParent != null}">No notes yet.
            <a th:href="@{/notes/new(parentType=${filterParent.type().name()},parentId=${filterParent.id()})}">
                Create the first note</a> for this
            <span th:text="${filterParent.type().name().toLowerCase().replace('_',' ')}">entity</span>.
        </p>
        <p th:if="${filterParent == null}">No notes yet. Create notes from within a course, topic, or other entity.</p>
    </div>

    <div class="note-list" th:if="${!#lists.isEmpty(notes)}">
        <div class="note-card" th:each="note : ${notes}">
            <div class="d-flex align-center" style="justify-content: space-between; gap: 1rem;">
                <div style="flex: 1; min-width: 0;">
                    <div class="d-flex align-center gap-4" style="margin-bottom: 0.25rem; flex-wrap: wrap;">
                        <a class="note-card-title"
                           th:href="@{/notes/{id}(id=${note.id})}"
                           th:text="${note.title}">Note Title</a>
                        <span class="text-small text-muted"
                              th:text="${#temporals.format(note.updatedAt, 'MMM d, yyyy')}">date</span>
                    </div>
                    <div class="note-preview"
                         th:if="${note.body != null and !note.body.isBlank()}"
                         th:text="${#strings.abbreviate(note.body, 120)}"></div>
                    <div th:if="${!#sets.isEmpty(note.topicTags)}"
                         class="topic-tags-row" style="margin-top: 0.35rem;">
                        <span th:each="topic : ${note.topicTags}" class="topic-tag topic-tag-sm">
                            <a th:href="@{/topics/{id}(id=${topic.id})}" th:text="${topic.title}">Topic</a>
                        </span>
                    </div>
                </div>
                <a th:href="@{/notes/{id}(id=${note.id})}" class="btn btn-secondary btn-sm"
                   style="flex-shrink: 0;">Open</a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
