<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Error</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="${status != null ? status : 'Error'}">Error</h1>
        <p class="page-subtitle" th:text="${message != null ? message : 'Something went wrong.'}">Something went wrong.</p>
    </div>
    <div th:if="${detail != null}" class="card">
        <div class="card-body">
            <code th:text="${detail}"></code>
        </div>
    </div>
    <p style="margin-top: 2rem;">
        <a th:href="@{/dashboard}" class="btn btn-primary">&#8592; Back to Dashboard</a>
    </p>
</div>
</body>
</html>
