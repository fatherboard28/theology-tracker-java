# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ────────────────────────────────────────────────────────────────
spring.application.name=Theology Study Tracker

# ─── SQLite DataSource ──────────────────────────────────────────────────────────
# The /app/data directory is bind-mounted from the host via Docker Compose.
# In local development (no Docker) the DB is created in ./data/ relative to the
# working directory.
spring.datasource.url=jdbc:sqlite:${THEOLOGY_DB_PATH:/app/data/theology.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite does not use a username/password
spring.datasource.username=
spring.datasource.password=

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Enable FK enforcement for SQLite at the connection level (see DatabaseConfig)
spring.jpa.properties.hibernate.connection.foreign_keys=true

# ─── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ─── Static Resources ──────────────────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.theology.tracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
